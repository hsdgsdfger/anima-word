<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>anima-word UI harness</title>
  <style>
    html, body { margin: 0; height: 100%; background: #101318; color: #e8ebf2; font-family: system-ui, sans-serif; }
    #testlog { position: fixed; left: 8px; bottom: 8px; z-index: 99; max-width: 48vw; max-height: 34vh; overflow: auto;
      background: rgba(0,0,0,.82); border: 1px solid #444; padding: 8px; font: 11px/1.5 monospace; white-space: pre-wrap; }
    #panel-host { height: 100%; }
  </style>
</head>
<body>
  <div id="panel-host"></div>
  <pre id="testlog"></pre>
  <script type="module">
    import { openStudio } from "./js/studio.js?v=106";

    const logEl = document.getElementById("testlog");
    const lines = [];
    function log(s) {
      lines.push(String(s));
      logEl.textContent = lines.join("\n");
    }
    function sleep(ms) { return new Promise((r) => setTimeout(r, ms)); }
    window.addEventListener("error", (e) => log("WINDOW_ERROR " + e.message));
    window.addEventListener("unhandledrejection", (e) => log("UNHANDLED " + (e.reason?.message || e.reason)));

    const studio = {
      version: 1, mode: "manual", order: "slot",
      items: [
        { id: "quality:masterpiece", cat: "quality", en: "masterpiece", zh: "杰作", slot: "quality", w: 1.0 },
        { id: "v6:hair:long hair", cat: "v6:hair", en: "long hair", zh: "长发", slot: "hair", w: 1.2 },
      ],
      quality_prefix: "masterpiece, best quality",
      extra_text: "", negative_preset: "standard", negative_extra: "", lora: [], ui: {},
    };
    const widget = (name, value) => ({ name, value, type: "string", options: {} });
    const node = {
      type: "AnimaPromptStudio",
      widgets: [
        widget("studio_json", JSON.stringify(studio)),
        widget("mode", "manual"),
        widget("nsfw_level", "sfw"),
        widget("seed", -1),
        widget("weights_json", ""),
        widget("role_pick", false), widget("scene_pick", false),
        widget("role_fav_only", false),
        widget("artist_weight", 0.9), widget("character_weight", 0.9),
        widget("clothing_weight", 0.9), widget("pose_weight", 0.9),
        widget("scene_weight", 0.9), widget("lighting_weight", 0.9),
        widget("camera_weight", 0.9), widget("detail_weight", 0.9),
        widget("nsfw_weight", 0.0),
        widget("extra_negative", ""),
        widget("cn_summary", true),
        widget("manual_text", ""),
      ],
    };
    window.__node = node;
    window.__modal = openStudio(node);

    setTimeout(async () => {
      try {
        await sleep(600);
        const activeTop = document.querySelector(".aps-subtab.on")?.dataset.tab || "";
        log("defaultTab=" + activeTop);
        if (activeTop !== "weights") throw new Error("default tab should be weights");

        const weightsSecs = document.querySelectorAll(".aps-v6-sec");
        log("weightSections=" + weightsSecs.length);
        if (!weightsSecs.length) throw new Error("weight library empty");
        const five = document.querySelector('.aps-v6-sec [data-v6-field][data-v6-val="5"]');
        log("hasFiveLevel=" + !!five);
        if (!five) throw new Error("missing 5 level button");
        five.click();
        await sleep(250);
        const wj0 = JSON.parse(node.widgets.find((w) => w.name === "weights_json").value || "{}");
        const firstField = Object.values(wj0.fields || {}).find((v) => Number(v) === 5);
        log("fiveSaved=" + (firstField !== undefined));
        if (firstField === undefined) throw new Error("clicking 5 did not save weight 5");

        document.querySelector('.aps-subtab[data-tab="prompts"]').click();
        await sleep(300);
        const trayHidden = !document.querySelector(".aps-tray").offsetParent;
        const sideHidden = !document.querySelector(".aps-side").offsetParent;
        log("templateTrayHidden=" + trayHidden + " sideHidden=" + sideHidden);
        if (!trayHidden || !sideHidden) throw new Error("template should hide tray and side");

        const fixed = document.querySelector(".aps-template-fixed");
        if (!fixed) throw new Error("missing fixed description input");
        fixed.value = "雨夜街头";
        fixed.dispatchEvent(new Event("change"));
        document.querySelector('.aps-subtab[data-tab="weights"]').click();
        await sleep(250);
        document.querySelector('.aps-subtab[data-tab="prompts"]').click();
        await sleep(250);
        if (document.querySelector(".aps-template-fixed").value !== "雨夜街头") {
          throw new Error("fixed description lost across tabs");
        }
        log("fixedPersisted=true");

        document.querySelector('.aps-ptab[data-ptab="general"]').click();
        await sleep(250);
        log("modeRow=" + document.querySelector(".aps-mode-row")?.style.display);
        if (document.querySelector(".aps-mode-row")?.style.display !== "none") {
          throw new Error("general should hide mode row");
        }
        const cards = document.querySelectorAll(".aps-card");
        log("cards=" + cards.length);
        if (!cards.length) throw new Error("no catalog cards rendered");
        const cardZh = cards[0].querySelector(".aps-card-zh")?.textContent || "";
        const cardEn = cards[0].querySelector(".aps-card-en")?.textContent || "";
        log("card0=" + cardZh + " / " + cardEn);
        if (!cardZh.trim() || !cardEn.trim() || cardZh.trim() === "...") {
          throw new Error("card title is empty or ellipsis");
        }
        const star = cards[0].querySelector(".aps-card-star");
        log("starBefore=" + star?.textContent);
        star?.click();
        await sleep(200);
        log("starAfter=" + cards[0].querySelector(".aps-card-star")?.textContent);
        if (cards[0].querySelector(".aps-card-star")?.textContent !== "★") {
          throw new Error("favorite star click failed");
        }

        cards[0].click();
        document.querySelector(".aps-preview-btn").click();
        await sleep(500);
        log("trayCount=" + document.querySelector(".aps-tray-n")?.textContent);
        log("trayWeightInputs=" + document.querySelectorAll(".aps-sel input[data-k]").length);
        if (document.querySelectorAll(".aps-sel input[data-k]").length) {
          throw new Error("tray should not render weight controls");
        }
        log("preview=" + (document.querySelector(".aps-preview .pos")?.textContent || "").slice(0, 80));

        const loraTab = document.querySelector('.aps-subtab[data-tab="lora"]');
        log("loraTabRemoved=" + !loraTab);
        if (loraTab) throw new Error("LoRA studio tab should be removed");

        document.querySelector(".aps-apply-btn").click();
        await sleep(200);
        const sj = JSON.parse(node.widgets.find((w) => w.name === "studio_json").value);
        log("savedMode=" + sj.mode + " items=" + (sj.items || []).length);
        if ("lora" in sj) throw new Error("studio_json should not carry lora anymore");

        const srcEl = document.querySelector(".aps-src");
        srcEl.value = "tools";
        srcEl.dispatchEvent(new Event("change"));
        await sleep(400);
        const srcCards = [...document.querySelectorAll(".aps-card")];
        const srcText = srcCards[0]?.querySelector(".aps-card-en")?.textContent || "";
        log("srcTools=" + srcCards.length + " / " + srcText);
        if (srcCards.length !== 1 || srcText !== "@test") throw new Error("source filter failed");
        srcEl.value = "";
        srcEl.dispatchEvent(new Event("change"));
        await sleep(300);

        document.querySelector('.aps-side-item[data-cat="v6:scene"]')?.click();
        await sleep(400);
        const randomBtn = document.querySelector(".aps-random");
        log("randomLabel=" + randomBtn?.textContent);
        if (!randomBtn || !randomBtn.textContent.includes("随机场景")) throw new Error("scene random label failed");
        randomBtn.click();
        await sleep(300);
        const sceneRow = [...document.querySelectorAll(".aps-sel")].find(
          (el) => el.dataset.id === "v6:scene:classroom");
        log("sceneRandom=" + (sceneRow ? sceneRow.dataset.id : "MISSING"));
        if (!sceneRow) throw new Error("scene random did not reach tray");
        document.querySelector('.aps-side-item[data-cat="__all__"]')?.click();
        await sleep(300);

        document.querySelector('.aps-subtab[data-tab="weights"]').click();
        await sleep(300);
        const each = document.querySelector(".aps-v6-random-each");
        log("randomEachChecked=" + each.checked);
        if (!each.checked) throw new Error("seed=-1 should mean per-task random");
        each.click();
        await sleep(200);
        log("randomEachOffSeed=" + node.widgets.find((w) => w.name === "seed").value);
        if (node.widgets.find((w) => w.name === "seed").value < 0) throw new Error("fixed seed not restored");
        each.click();
        await sleep(200);
        log("randomEachOnSeed=" + node.widgets.find((w) => w.name === "seed").value);
        if (node.widgets.find((w) => w.name === "seed").value !== -1) throw new Error("per-task random not set");

        log("DONE");
      } catch (e) {
        log("TEST_ERROR " + (e?.stack || e));
        log("DONE_WITH_ERROR");
      }
    }, 900);
  </script>
</body>
</html>
